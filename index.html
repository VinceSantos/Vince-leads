<!DOCTYPE html>
<html>
<head>
<title>GM Preferred Pricing</title>

<style>
body {
  font-family: Arial;
  background: radial-gradient(circle at top, #1e3a8a, black);
  color: white;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 520px;
  margin: auto;
}

.form-box {
  background: rgba(0,0,0,0.85);
  padding: 30px;
  border-radius: 12px;
}

h1 {
  text-align: center;
  color: #60a5fa;
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  background: blue;
  color: white;
  border: none;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
<div class="form-box">

<h1>GM Preferred Pricing</h1>

<!-- ✅ THIS FIXES SUBMIT -->
<form action="https://formsubmit.co/vsantos@woodbinegm.com" method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New Preferred Pricing Lead">
<input type="hidden" name="_autoresponse" value="Thanks for your submission! This is Vince from Woodbine GM. I’ll contact you shortly.">

<input type="text" name="Name" placeholder="Full Name" required>
<input type="text" name="Phone" placeholder="Phone Number" required>
<input type="email" name="Email" placeholder="Email Address" required>

<input type="text" name="Company" placeholder="Company / Employer">

<select name="Monthly Budget" required>
  <option value="">Monthly Budget</option>
  <option>$300-400</option>
  <option>$400-500</option>
  <option>$500-600</option>
  <option>$600+</option>
</select>

<input type="text" name="Down Payment" placeholder="Down Payment ($)">

<select name="Brand" required>
  <option value="">Brand</option>
  <option>Chevrolet</option>
  <option>GMC</option>
  <option>Buick</option>
  <option>Cadillac</option>
</select>

<button type="submit">Check My Pricing</button>

</form>

</div>
</div>

</body>
</html>
