<!DOCTYPE html>
<html lang="en">
<head>

<title>Get Approved Today</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #0f172a;

}

.container {
    max-width: 400px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    color: #60a5fa;
    margin-bottom: 10px;
}

p {
    color: #cbd5f5;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {

    margin-top: 20px;

    border-radius: 8px;
    background: #3b82f6;

<body>

<div class="container">
    <h1>🚗 Get Approved for a Vehicle</h1>
    <p>Fast • Easy • All Credit Accepted</p>
