<!DOCTYPE html>
<html>
<head>
<title>GM Approval Application</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #0b0b0b;
  color: white;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: 30px auto;
  padding: 25px;
  background: #111;
  border-radius: 12px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: none;
  border-radius: 6px;
}

button {
  width: 100%;
  padding: 14px;
  background: #3b82f6;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<h1 style="color:#60a5fa;">🚗 Get Approved Today</h1>
<p>Fast • Easy • All Credit Accepted</p>

<div class="container">

<form action="https://formsubmit.co/chivince2@icloud.com" method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="thankyou.html">

<input name="Name" placeholder="Full Name" required>
<input name="Phone" placeholder="Phone Number" required>
<input type="email" name="Email" placeholder="Email Address" required>

<input name="Occupation" placeholder="Occupation">

<select name="Monthly Payment" required>
<option value="">Monthly Budget</option>
<option>$300 - $400</option>
<option>$400 - $500</option>
<option>$500 - $600</option>
<option>$600 - $700</option>
<option>$700+</option>
</select>

<!-- MAKE -->
<select id="brand" name="Brand" onchange="updateModels()" required>
<option value="">Select Brand</option>
<option value="Chevrolet">Chevrolet</option>
<option value="GMC">GMC</option>
<option value="Buick">Buick</option>
</select>

<!-- MODEL -->
<select id="model" name="Model" onchange="updateTrims()" required>
<option value="">Select Model</option>
</select>

<!-- TRIM -->
<select id="trim" name="Trim" required>
<option value="">Select Trim</option>
</select>

<button type="submit">Get Approved Now</button>

</form>

</div>

<script>
const models = {
  Chevrolet: ["Trax", "Silverado", "Equinox", "Traverse", "Malibu", "Tahoe"],
  GMC: ["Sierra", "Terrain", "Acadia", "Yukon"],
  Buick: ["Encore GX", "Envista", "Envision", "Enclave"]
};

const trims = {
  "Trax": ["LS", "1RS", "LT", "2RS", "ACTIV"],
  "Silverado": ["WT", "Custom", "LT", "RST", "High Country"],
  "Equinox": ["LS", "LT", "RS", "Premier"],
  "Traverse": ["LS", "LT", "RS", "Z71"],
  "Malibu": ["LS", "LT", "RS"],
  "Tahoe": ["LS", "LT", "RST", "Z71", "High Country"],

  "Sierra": ["Pro", "SLE", "Elevation", "SLT", "Denali"],
  "Terrain": ["SLE", "SLT", "Denali"],
  "Acadia": ["SLE", "SLT", "AT4", "Denali"],
  "Yukon": ["SLE", "SLT", "AT4", "Denali"],

  "Encore GX": ["Preferred", "Sport Touring", "Avenir"],
  "Envista": ["Preferred", "Sport Touring", "Avenir"],
  "Envision": ["Preferred", "Sport Touring", "Avenir"],
  "Enclave": ["Preferred", "Sport Touring", "Avenir"]
};

function updateModels() {
  const brand = document.getElementById("brand").value;
  const model = document.getElementById("model");
  const trim = document.getElementById("trim");

  model.innerHTML = "<option value=''>Select Model</option>";
  trim.innerHTML = "<option value=''>Select Trim</option>";

  if (models[brand]) {
    models[brand].forEach(function(m) {
      let option = new Option(m, m);
      model.add(option);
    });
  }
}

function updateTrims() {
  const modelSelected = document.getElementById("model").value;
  const trim = document.getElementById("trim");

  trim.innerHTML = "<option value=''>Select Trim</option>";

  if (trims[modelSelected]) {
    trims[modelSelected].forEach(function(t) {
      let option = new Option(t, t);
      trim.add(option);
    });
  }
}
</script>

</body>
</html>
