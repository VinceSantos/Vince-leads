<!DOCTYPE html>
<html>
<head>
<title>Woodbine GM</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(255,255,255,0.85)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70');
  background-size: cover;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.header {
  text-align: center;
  color: white;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 20px;
  width: 380px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.section {
  margin-top: 20px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

label {
  font-weight: bold;
  margin-top: 10px;
  display: block;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 10px;
  background: green;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.footer {
  margin-top: 10px;
  background: black;
  color: white;
  text-align: center;
  padding: 8px;
  border-radius: 10px;
  font-size: 12px;
}
</style>
</head>

<body>

<div>

  <div class="header">
    <h1>WOODBINE GM</h1>
    <p>Showroom Application</p>
  </div>

  <form class="card">

    <!-- CUSTOMER -->
    <div class="section">
      <h2>Customer</h2>

      <input placeholder="Full Name" required>
      <input placeholder="Phone" required>
      <input placeholder="Email" required>
      <input placeholder="Occupation / Company">
    </div>

    <!-- VEHICLES -->
    <div class="section">
      <h2>Select Vehicle</h2>

      <label>Chevrolet</label>
      <select>
        <option>Select Chevrolet</option>
        <option>Silverado</option>
        <option>Colorado</option>
        <option>Tahoe</option>
      </select>

      <label>GMC</label>
      <select>
        <option>Select GMC</option>
        <option>Sierra</option>
        <option>Yukon</option>
      </select>

      <label>Buick</label>
      <select>
        <option>Select Buick</option>
        <option>Envista</option>
        <option>Enclave</option>
      </select>
    </div>

    <!-- PAYMENT -->
    <div class="section">
      <h2>Payment Type</h2>

      <select>
        <option>Select Payment Type</option>
        <option>Finance</option>
        <option>Lease</option>
        <option>Cash</option>
      </select>
    </div>

    <!-- BUTTON -->
    <button type="submit">Submit Application</button>

    <div class="footer">
      OMVIC REGISTERED DEALER
    </div>

  </form>

</div>

</body>
</html>
