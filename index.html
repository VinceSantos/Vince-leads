<!DOCTYPE html>
<html>
<head>
<title>GM Preferred Pricing Application</title>

<style>
body {
  font-family: Arial;
  background: radial-gradient(circle at top, #1e3a8a, black);
  color: white;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 520px;
  margin: auto;
}

.form-box {
  background: rgba(0,0,0,0.85);
  padding: 30px;
  border-radius: 12px;
}

h1 {
  text-align: center;
  color: #60a5fa;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #ccc;
  margin-bottom: 20px;
}

/* Inputs */
input, select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 15px;
  border-radius: 8px;
  border: none;
}

/* Button */
button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  background: linear-gradient(to right, #3b82f6, #60a5fa);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="container">
<div class="form-box">

<h1>GM Preferred Pricing</h1>
<p class="subtitle">Check if you qualify for special pricing and incentives</p>

https://formsubmit.co/vsantos@woodbinegm.com

<!-- SETTINGS -->
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New Preferred Pricing Lead">
<input type="hidden" name="_autoresponse" value="Thanks for your submission! This is Vince from Woodbine GM. I'm reviewing your preferred pricing eligibility and will contact you shortly with options.">

<!-- CUSTOMER INFO -->
<input type="text" name="Name" placeholder="Full Name" required>
<input type="text" name="Phone" placeholder="Phone Number" required>
<input type="email" name="Email" placeholder="Email Address" required>

<!-- ✅ NEW: EMPLOYMENT -->
<input type="text" name="Company / Employer" placeholder="Company / Employer (for preferred pricing)">

<input type="text" name="Occupation" placeholder="Job Title">
<input type="text" name="Trade" placeholder="Trade-in Vehicle (optional)">

<!-- BUDGET -->
<select name="Monthly Budget" required>
  <option value="">Select Monthly Budget</option>
  <option>$300 - $400</option>
  <option>$400 - $500</option>
  <option>$500 - $600</option>
  <option>$600 - $700</option>
  <option>$700+</option>
</select>

<input type="text" name="Down Payment" placeholder="Down Payment ($)">

<!-- VEHICLE -->
<select name="Brand" id="brand" onchange="updateModels()" required>
  <option value="">Select Brand</option>
  <option>Chevrolet</option>
  <option>GMC</option>
  <option>Buick</option>
  <option>Cadillac</option>
</select>

<select name="Model" id="model" required>
  <option>Select Model</option>
</select>

<button type="submit">Check My Pricing</button>

</form>

</div>
</div>

<script>
function updateModels() {

  var brand = document.getElementById("brand").value;
  var model = document.getElementById("model");

  model.innerHTML = "<option>Select Model</option>";

  var data = {
    Chevrolet: ["Trax","Equinox","Blazer","Traverse","Tahoe","Suburban","Silverado"],
    GMC: ["Terrain","Acadia","Yukon","Sierra","Canyon"],
    Buick: ["Encore GX","Envista","Envision","Enclave"],
    Cadillac: ["XT4","XT5","XT6","Escalade","Lyriq"]
  };

  if (data[brand]) {
    data[brand].forEach(function(m) {
      var option = document.createElement("option");
      option.text = m;
      model.add(option);
    });
  }
}
</script>

</body>
</html>
