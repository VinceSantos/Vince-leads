<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Woodbine GM</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(255,255,255,0.85)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70');
  background-size: cover;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Card */
.card {
  background: white;
  padding: 30px;
  border-radius: 20px;
  width: 380px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

h1 {
  text-align: center;
  color: white;
}

.header {
  text-align: center;
  margin-bottom: 20px;
  color: white;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: green;
  color: white;
  font-size: 16px;
}

.footer {
  margin-top: 10px;
  background: black;
  color: white;
  text-align: center;
  padding: 8px;
  border-radius: 10px;
  font-size: 12px;
}
</style>
</head>

<body>

<div>
  <div class="header">
    <h1>WOODBINE GM</h1>
    <p>Showroom Application</p>
  </div>

  <div class="card">

    <h2 style="text-align:center;">Customer</h2>

    <input placeholder="Full Name">
    <input placeholder="Phone">
    <input placeholder="Email">
    <input placeholder="Occupation / Company">

    <h2 style="text-align:center;">Select Vehicle</h2>

    <label>Chevrolet</label>
    <select>
      <option>Chevrolet</option>
      <option>Silverado</option>
      <option>Tahoe</option>
      <option>Equinox</option>
    </select>

    <label>GMC</label>
    <select>
      <option>GMC</option>
      <option>Sierra</option>
      <option>Yukon</option>
    </select>

    <label>Buick</label>
    <select>
      <option>Buick</option>
      <option>Envista</option>
      <option>Enclave</option>
    </select>

    <select>
      <option>Select Payment Type</option>
      <option>Finance</option>
      <option>Lease</option>
      <option>Cash</option>
    </select>

    <button>Submit Application ✅</button>

    <div class="footer">
      OMVIC REGISTERED DEALER
    </div>

  </div>
</div>

</body>
</html>
``
