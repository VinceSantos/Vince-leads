<!DOCTYPE html>
<html>
<body style="font-family:Arial; margin:0; color:white;">

<!-- ✅ BACKGROUND IMAGE -->
<div style="
background:url('https://images.unsplash.com/photo-1616788494672-ec7ca93aa2fd') no-repeat center center;
background-size:cover;
min-height:100vh;
">

<!-- DARK OVERLAY -->
<div style="background:rgba(0,0,0,0.75); min-height:100vh;">

<!-- HEADER -->
<div style="text-align:center; padding:40px;">
  <h1>Get Approved for a Vehicle Today</h1>
  <p>All Credit Accepted • Fast Approvals • Drive Today</p>
</div>

<!-- FORM -->
<div style="max-width:600px; margin:auto; background:#111; padding:30px; border-radius:10px;">

<h2 style="text-align:center; color:#60a5fa;">Start Your Application</h2>

<!-- ✅ CORRECT FORM (THIS FIXES EVERYTHING) -->
<form action="https://formsubmit.co/chivince2@icloud.com" method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New GM Lead">
<input type="hidden" name="_autoresponse" value="Thanks for your application! This is Vince from Woodbine GM. I will contact you shortly.">

<!-- INPUTS -->
<input name="Name" placeholder="Full Name" required style="width:100%; padding:14px; margin:8px 0;"><br>
<input name="Phone" placeholder="Phone Number" required style="width:100%; padding:14px; margin:8px 0;"><br>
<input name="Email" placeholder="Email Address" required style="width:100%; padding:14px; margin:8px 0;"><br>

<input name="Company" placeholder="Company / Employer" style="width:100%; padding:14px; margin:8px 0;"><br>

<select name="Monthly Budget" required style="width:100%; padding:14px; margin:8px 0;">
<option value="">Monthly Budget</option>
<option>$300 - $400</option>
<option>$400 - $500</option>
<option>$500 - $600</option>
<option>$600 - $700</option>
<option>$700+</option>
</select><br>

<input name="Down Payment" placeholder="Down Payment ($)" style="width:100%; padding:14px; margin:8px 0;"><br>

<select id="brand" name="Brand" onchange="updateModels()" required style="width:100%; padding:14px; margin:8px 0;">
<option value="">Select Brand</option>
<option>Chevrolet</option>
<option>GMC</option>
<option>Buick</option>
<option>Cadillac</option>
</select><br>

<select id="model" name="Model" required style="width:100%; padding:14px; margin:8px 0;">
<option>Select Model</option>
</select><br>

<!-- ✅ BUTTON (NOW WORKS) -->
<button type="submit" style="width:100%; padding:16px; font-size:18px; background:#3b82f6; color:white; border:none; margin-top:10px;">
Submit
</button>

</form>

</div>

<!-- FOOTER -->
<div style="text-align:center; padding:20px;">
  ✔ Fast Approval • ✔ All Credit Welcome • ✔ Easy Process
</div>

</div>
</div>

<!-- MODEL SCRIPT -->
<script>
function updateModels() {
  var brand = document.getElementById("brand").value;
  var model = document.getElementById("model");

  var data = {
    Chevrolet: ["Trax","Equinox","Blazer","Traverse","Tahoe","Suburban","Silverado"],
    GMC: ["Terrain","Acadia","Yukon","Sierra","Canyon"],
    Buick: ["Encore GX","Envista","Envision","Enclave"],
    Cadillac: ["XT4","XT5","XT6","Escalade","Lyriq"]
  };

  model.innerHTML = "<option>Select Model</option>";

  if (data[brand]) {
    data[brand].forEach(function(m) {
      var option = document.createElement("option");
      option.text = m;
      model.add(option);
    });
  }
}
</script>

</body>
</html>
