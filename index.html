<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM Approval</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    max-width: 400px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    color: #60a5fa;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}
</style>
</head>

<body>

<div class="container">
    <h1>🚗 Get Approved for a GM Vehicle</h1>
    <p>Fast • Easy • All Credit Accepted</p>

    <!-- ✅ FORM (FIXED) -->
    <form action="https://formsubmit.co/chivince2@icloud.com" method="POST">

        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="thankyou.html">

        <input type="text" name="Name" placeholder="Full Name" required>
        <input type="tel" name="Phone" placeholder="Phone Number" required>
        <input type="email" name="Email" placeholder="Email Address" required>

        <!-- Monthly Payment -->
        <select name="Monthly Payment" required>
            <option value="">Desired Monthly Payment</option>
            <option>$200 - $300</option>
            <option>$300 - $400</option>
            <option>$400 - $500</option>
            <option>$500 - $600</option>
            <option>$600+</option>
        </select>

        <!-- Occupation -->
        <input type="text" name="Occupation" placeholder="Occupation">

        <!-- Make -->
        <select id="make" name="Vehicle Make" required onchange="updateModels()">
            <option value="">Select Brand</option>
            <option value="Chevrolet">Chevrolet</option>
            <option value="GMC">GMC</option>
            <option value="Buick">Buick</option>
        </select>

        <!-- Model -->
        <select id="model" name="Vehicle Model" required>
            <option value="">Select Model</option>
        </select>

        <button type="submit">Get Approved Now</button>
    </form>
</div>

<!-- ✅ SCRIPT FOR DYNAMIC MODELS -->
<script>
const models = {
    Chevrolet: [
        "Silverado 1500",
        "Equinox",
        "Traverse",
        "Malibu",
        "Tahoe",
        "Suburban"
    ],
    GMC: [
        "Sierra 1500",
        "Terrain",
        "Acadia",
        "Yukon"
    ],
    Buick: [
        "Encore",
        "Encore GX",
        "Envision",
        "Enclave"
    ]
};

function updateModels() {
    const make = document.getElementById("make").value;
    const modelSelect = document.getElementById("model");

    modelSelect.innerHTML = '<option value="">Select Model</option>';

    if (models[make]) {
        models[make].forEach(function(model) {
            const option = document.createElement("option");
            option.value = model;
            option.textContent = model;
            modelSelect.appendChild(option);
        });
    }
}
</script>

</body>
</html>
