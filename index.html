<!DOCTYPE html>
<html>
<head>
<title>GM Application</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #1e3a8a, black);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.form-box {
  width: 320px;
  padding: 20px;
  background: rgba(0,0,0,0.7);
  border-radius: 10px;
  text-align: center;
}

h2 {
  color: #60a5fa;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
  border: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: linear-gradient(to right, #3b82f6, #60a5fa);
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 16px;
}
</style>

</head>

<body>

<div class="form-box">

<h2>General Motors</h2>

<form action="https://formsubmit.co/vsantos@woodbinegm.com" method="POST">

<!-- Auto reply -->
<input type="hidden" name="_autoresponse" value="Thanks for your inquiry! This is Vince from Woodbine GM. I’ll reach out shortly.">

<!-- Email subject -->
<input type="hidden" name="_subject" value="New GM Lead">

<!-- Turn off captcha -->
<input type="hidden" name="_captcha" value="false">

<input type="text" name="Name" placeholder="Name" required>
<input type="text" name="Phone" placeholder="Phone" required>
<input type="email" name="Email" placeholder="Email" required>

<input type="text" name="Occupation" placeholder="Occupation">
<input type="text" name="Trade" placeholder="Trade (optional)">

<select name="Monthly Budget" required>
  <option value="">Select Monthly Budget</option>
  <option>$300–$400</option>
  <option>$400–$500</option>
  <option>$500–$600</option>
  <option>$600–$700</option>
  <option>$700+</option>
</select>

<input type="text" name="Down Payment" placeholder="Down Payment ($)">

<select name="Brand" id="brand" onchange="updateModels()" required>
  <option value="">Select Brand</option>
  <option>Chevrolet</option>
  <option>GMC</option>
  <option>Buick</option>
  <option>Cadillac</option>
</select>

<select name="Model" id="model" required>
  <option>Select Model</option>
</select>

<button type="submit">Submit</button>

</form>

</div>

<script>
function updateModels() {
  var brand = document.getElementById("brand").value;
  var model = document.getElementById("model");

  model.innerHTML = "<option>Select Model</option>";

  var data = {
    Chevrolet: ["Trax","Equinox","Blazer","Traverse","Tahoe","Suburban","Silverado"],
    GMC: ["Terrain","Acadia","Yukon","Sierra","Canyon"],
    Buick: ["Encore GX","Envista","Envision","Enclave"],
    Cadillac: ["XT4","XT5","XT6","Escalade","Lyriq"]
  };

  if (data[brand]) {
    data[brand].forEach(function(m) {
      var option = document.createElement("option");
      option.text = m;
      model.add(option);
    });
  }
}
</script>

</body>
</html>
