<!DOCTYPE html>
<html>
<head>
<title>GM Application</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: url('https://images.unsplash.com/photo-1611403579043-d6c79e0f6296') no-repeat center center/cover;
}

.overlay {
  background: rgba(0,0,0,0.75);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.form-box {
  width: 320px;
  padding: 20px;
  background: rgba(0,0,0,0.6);
  border-radius: 10px;
  text-align: center;
}

h2 {
  color: #5aa9ff;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
  border: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: linear-gradient(to right, #3b82f6, #60a5fa);
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="overlay">
<div class="form-box">

<h2>General Motors</h2>

<form action="https://formsubmit.co/vsantos@woodbinegm.com" method="POST">

<!-- ✅ Auto Response -->
<input type="hidden" name="_autoresponse" value="Thanks for your inquiry! This is Vince from Woodbine GM. I’ve received your request and will be reaching out shortly to help you with your vehicle options. Looking forward to connecting with you!">

<!-- ✅ Subject -->
<input type="hidden" name="_subject" value="New GM Lead – Woodbine GM">

<input type="text" name="Name" placeholder="Name" required>
<input type="text" name="Phone" placeholder="Phone" required>
<input type="email" name="Email" placeholder="Email" required>
<input type="text" name="Occupation" placeholder="Occupation">
<input type="text" name="Trade" placeholder="Trade (optional)">

<select name="Brand" id="brand" onchange="updateModels()" required>
  <option value="">Select Brand</option>
  <option value="Chevrolet">Chevrolet</option>
  <option value="GMC">GMC</option>
  <option value="Buick">Buick</option>
  <option value="Cadillac">Cadillac</option>
</select>

<select name="Model" id="model" required>
  <option>Select Model</option>
</select>

<button type="submit">Submit</button>

</form>

</div>
</div>

<script>
function updateModels() {

  var brand = document.getElementById("brand").value;
  var model = document.getElementById("model");

  model.innerHTML = "<option>Select Model</option>";

  var models = [];

  if (brand === "Chevrolet") {
    models = ["Trax", "Equinox", "Blazer", "Traverse", "Tahoe", "Suburban", "Silverado"];
  }

  if (brand === "GMC") {
    models = ["Terrain", "Acadia", "Yukon", "Sierra", "Canyon"];
  }

  if (brand === "Buick") {
    models = ["Encore GX", "Envista", "Envision", "Enclave"];
  }

  if (brand === "Cadillac") {
    models = ["XT4", "XT5", "XT6", "Escalade", "Lyriq"];
  }

  for (var i = 0; i < models.length; i++) {
    var option = document.createElement("option");
    option.text = models[i];
    model.add(option);
  }
}
</script>

</body>
</html>
``
