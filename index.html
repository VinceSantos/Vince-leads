<!DOCTYPE html>
<html>
<head>
<title>GM Approval</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family:Arial; background:black; color:white; text-align:center; padding:40px;">

<h1 style="color:#60a5fa;">🚗 Get Approved for a GM Vehicle</h1>
<p>Fast • Easy • All Credit Accepted</p>

<form action="https://formsubmit.co/chivince2@icloud.com" method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="thankyou.html">

<br>
<input name="Name" placeholder="Full Name" required><br><br>
<input name="Phone" placeholder="Phone Number" required><br><br>
<input type="email" name="Email" placeholder="Email Address" required><br><br>

<select name="Monthly Payment" required>
<option value="">Monthly Payment</option>
<option>$200 - $300</option>
<option>$300 - $400</option>
<option>$400 - $500</option>
<option>$500 - $600</option>
<option>$600+</option>
</select><br><br>

<input name="Occupation" placeholder="Occupation"><br><br>

<select id="make" name="Make" onchange="updateModels()" required>
<option value="">Select Brand</option>
<option value="Chevrolet">Chevrolet</option>
<option value="GMC">GMC</option>
<option value="Buick">Buick</option>
</select><br><br>

<select id="model" name="Model" required>
<option value="">Select Model</option>
</select><br><br>

<button type="submit" style="padding:12px 20px; background:#3b82f6; color:white; border:none;">
Get Approved
</button>

</form>

<script>
function updateModels() {
  var make = document.getElementById("make").value;
  var model = document.getElementById("model");

  model.innerHTML = "<option value=''>Select Model</option>";

  var data = {
    Chevrolet: ["Trax", "Silverado", "Equinox", "Traverse", "Malibu", "Tahoe"],
    GMC: ["Sierra", "Terrain", "Acadia", "Yukon"],
    Buick: ["Encore", "Encore GX", "Envision", "Enclave"]
  };

  if (data[make]) {
    data[make].forEach(function(car) {
      var option = document.createElement("option");
      option.value = car;
      option.text = car;
      model.add(option);
    });
  }
}
</script>

</body>
</html>
