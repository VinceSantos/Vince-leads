<!DOCTYPE html>
<html>
<body style="font-family:Arial; background:black; color:white; text-align:center;">

<h2>GM Preferred Pricing</h2>

<form action="https://formsubmit.co/vsantos@woodbinegm.com" method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New GM Lead">
<input type="hidden" name="_autoresponse" value="Thanks for your inquiry! This is Vince from Woodbine GM. I will contact you shortly.">

<br>
<input name="Name" placeholder="Full Name" required><br><br>
<input name="Phone" placeholder="Phone Number" required><br><br>
<input name="Email" placeholder="Email Address" required><br><br>

<input name="Company" placeholder="Company / Employer"><br><br>

<select name="Monthly Budget" required>
<option value="">Monthly Budget</option>
<option>$300-400</option>
<option>$400-500</option>
<option>$500-600</option>
<option>$600+</option>
</select><br><br>

<input name="Down Payment" placeholder="Down Payment"><br><br>

<select id="brand" name="Brand" onchange="updateModels()" required>
<option value="">Select Brand</option>
<option>Chevrolet</option>
<option>GMC</option>
<option>Buick</option>
<option>Cadillac</option>
</select><br><br>

<select id="model" name="Model" required>
<option>Select Model</option>
</select><br><br>

<button type="submit">Submit</button>

</form>

<script>
function updateModels() {
  var brand = document.getElementById("brand").value;
  var model = document.getElementById("model");

  var data = {
    Chevrolet: ["Trax","Equinox","Blazer","Traverse","Tahoe","Suburban","Silverado"],
    GMC: ["Terrain","Acadia","Yukon","Sierra","Canyon"],
    Buick: ["Encore GX","Envista","Envision","Enclave"],
    Cadillac: ["XT4","XT5","XT6","Escalade","Lyriq"]
  };

  model.innerHTML = "<option>Select Model</option>";

  if (data[brand]) {
    data[brand].forEach(function(m) {
      var option = document.createElement("option");
      option.text = m;
      model.add(option);
    });
  }
}
</script>

</body>
</html>
