<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Approved Today</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    max-width: 400px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    color: #60a5fa;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}

.badge {
    margin-top: 20px;
    font-size: 14px;
    color: #9ca3af;
}
</style>
</head>

<body>

<div class="container">
    <h1>🚗 Get Approved for a Vehicle</h1>
    <p>Fast • Easy • All Credit Accepted</p>

    <form action="https://formsubmit.co/chivince2@icloud.com" method="POST">
        
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="thankyou.html">

        <input type="text" name="Name" placeholder="Full Name" required>
        <input type="tel" name="Phone" placeholder="Phone Number" required>
        <input type="email" name="Email" placeholder="Email Address" required>

        <!-- Monthly Payment -->
        <select name="Monthly Payment" required>
            <option value="">Desired Monthly Payment</option>
            <option>$200 - $300</option>
            <option>$300 - $400</option>
            <option>$400 - $500</option>
            <option>$500 - $600</option>
            <option>$600+</option>
        </select>

        <!-- Occupation -->
        <input type="text" name="Occupation" placeholder="Occupation">

        <!-- Make -->
        <select name="Vehicle Make" required>
            <option value="">Preferred Make</option>
            <option>Toyota</option>
            <option>Honda</option>
            <option>Ford</option>
            <option>Chevrolet</option>
            <option>Nissan</option>
            <option>BMW</option>
            <option>Mercedes-Benz</option>
            <option>Other</option>
        </select>

        <!-- Model -->
        <select name="Vehicle Model">
            <option value="">Preferred Model</option>
            <option>Civic</option>
            <option>Corolla</option>
            <option>CR-V</option>
            <option>RAV4</option>
            <option>F-150</option>
            <option>Silverado</option>
            <option>Altima</option>
            <option>Other</option>
        </select>

        <button type="submit">Get Approved Now</button>
    </form>

    <div class="badge">✅ No Obligation • ✅ Secure • ✅ Takes 30 Seconds</div>
</div>

</body>
</html>
